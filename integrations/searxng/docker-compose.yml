# Start from this directory: docker compose up -d
# Set SEARXNG_SECRET in integrations/searxng/.env (never commit secrets).
services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?Create a strong SEARXNG_SECRET in local .env}
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
volumes:
  searxng-cache:
